name: Handle Availability Check

on:
  workflow_dispatch:
    inputs:
      choice:
        description: 'Select Username Format'
        required: true
        type: choice
        default: '4l'
        options:
          - '2l'
          - '2c'
          - '3l'
          - '3c'
          - '4l'
          - '4c'
          - '5l'
          - '5c'
          - 'words'
          - 'custom'
      amount:
        description: 'How many handles to check?'
        required: true
        default: '5'
      custom_length:
        description: 'Custom length (only if custom chosen)'
        required: false
        default: '6'

jobs:
  run-checker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          USER_CHOICE: ${{ inputs.choice }}
          USER_AMOUNT: ${{ inputs.amount }}
          CUSTOM_LENGTH: ${{ inputs.custom_length }}
        run: python checker.py
